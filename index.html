<!DOCTYPE html>
<html>
<head>
    <title>Event Explorer</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .filters {
            text-align: center;
            margin: 20px;
        }

        input, select {
            padding: 10px;
            margin: 5px;
        }

        #events {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 5px gray;
        }

        .card h3 {
            color: darkblue;
        }

        #noResult {
            text-align: center;
            color: red;
            font-size: 20px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Event Explorer</h1>

    <div class="filters">

        <input type="text" id="search"
        placeholder="Search events...">

        <select id="category">
            <option value="All">All Categories</option>
            <option value="Technical">Technical</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
        </select>

        <input type="date" id="date">

        <select id="sort">
            <option value="default">Sort By</option>
            <option value="asc">Date: Oldest First</option>
            <option value="desc">Date: Newest First</option>
        </select>

    </div>

    <div id="events"></div>

    <script>

        // Event data using JSON objects

        const events = [
            {
                name: "Coding Competition",
                category: "Technical",
                date: "2026-12-10",
                description: "Participate in coding challenges."
            },
            {
                name: "Dance Festival",
                category: "Cultural",
                date: "2026-12-15",
                description: "Enjoy music and dance performances."
            },
            {
                name: "Cricket Tournament",
                category: "Sports",
                date: "2026-12-20",
                description: "Inter-college cricket competition."
            },
            {
                name: "Web Development Workshop",
                category: "Technical",
                date: "2026-12-05",
                description: "Learn HTML, CSS and JavaScript."
            },
            {
                name: "Music Concert",
                category: "Cultural",
                date: "2026-12-25",
                description: "Enjoy live music performances."
            }
        ];

        // Display events dynamically

        function displayEvents(data) {

            const container = document.getElementById("events");

            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML =
                "<p id='noResult'>No Results Found!</p>";
                return;
            }

            data.forEach(event => {

                container.innerHTML += `
                    <div class="card">
                        <h3>${event.name}</h3>
                        <p><b>Category:</b> ${event.category}</p>
                        <p><b>Date:</b> ${event.date}</p>
                        <p>${event.description}</p>
                    </div>
                `;

            });
        }

        // Search, filter and sorting

        function filterEvents() {

            let keyword = document.getElementById("search")
            .value.toLowerCase();

            let category = document.getElementById("category")
            .value;

            let date = document.getElementById("date").value;

            let sort = document.getElementById("sort").value;

            let filtered = events.filter(event => {

                let matchKeyword =
                    event.name.toLowerCase().includes(keyword) ||
                    event.description.toLowerCase().includes(keyword);

                let matchCategory =
                    category === "All" ||
                    event.category === category;

                let matchDate =
                    date === "" || event.date === date;

                return matchKeyword && matchCategory && matchDate;

            });

            // Sorting events by date

            if (sort === "asc") {
                filtered.sort((a, b) =>
                    new Date(a.date) - new Date(b.date));
            }

            if (sort === "desc") {
                filtered.sort((a, b) =>
                    new Date(b.date) - new Date(a.date));
            }

            displayEvents(filtered);
        }

        // Event listeners

        document.getElementById("search")
        .addEventListener("input", filterEvents);

        document.getElementById("category")
        .addEventListener("change", filterEvents);

        document.getElementById("date")
        .addEventListener("change", filterEvents);

        document.getElementById("sort")
        .addEventListener("change", filterEvents);

        // Display all events initially

        displayEvents(events);

    </script>

</body>
</html>
